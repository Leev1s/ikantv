plugins {
    id 'com.android.application'
}

dependencyLocking { lockAllConfigurations() }

// build.sh remains the sole release-version source for local and CI builds.
def releaseScript = rootProject.file('build.sh').text
def releaseCode = (releaseScript =~ /(?m)^VERSION_CODE=(\d+)$/)[0][1].toInteger()
def releaseName = (releaseScript =~ /(?m)^VERSION_NAME=([\w.\-]+)$/)[0][1]

android {
    namespace 'com.lev1s.ikantv'
    compileSdk 34
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId 'com.lev1s.ikantv'
        minSdk 28
        targetSdk 34
        versionCode releaseCode
        versionName releaseName
        ndk { abiFilters 'armeabi-v7a' }
    }
    signingConfigs {
        release {
            def signingPath = System.getenv('IKANTV_KEYSTORE_FILE')
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('IKANTV_STORE_PASSWORD')
                keyAlias System.getenv('IKANTV_KEY_ALIAS')
                keyPassword System.getenv('IKANTV_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging true } }
    sourceSets { test.java.srcDirs += rootProject.file('tests/java') }
}

dependencies {
    // Original artifacts are still fetched and SHA-256 checked by fetch-deps.sh.
    // AGP merges the AAR's resources and generates org.videolan.R correctly.
    implementation files(rootProject.file('build-deps/libvlc-all-3.5.1.aar'))
    implementation files(rootProject.file('build-deps/jsoup-1.18.3.jar'))
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation 'junit:junit:4.13.2'
}
