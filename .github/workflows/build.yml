name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 34, build-tools 34.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # Signing keystore, first hit wins:
      #   1. Repository secret SIGNING_KEYSTORE_B64 (base64 of ikanbot-tv.jks)
      #   2. keystore/ikanbot-tv.jks.b64 committed in this private repo
      # Passwords: secrets KEYSTORE_PASSWORD / KEY_PASSWORD if set,
      # otherwise the long-standing local defaults inside build.sh.
      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ikanbot-tv.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ikanbot-tv.jks" >> "$GITHUB_ENV"
            echo "keystore source: GitHub secret"
          elif [ -f keystore/ikanbot-tv.jks.b64 ]; then
            echo "keystore source: repo base64 file (build.sh decodes it)"
          else
            echo "::error::No signing keystore: set secret SIGNING_KEYSTORE_B64 or commit keystore/ikanbot-tv.jks.b64"
            exit 1
          fi
          [ -n "$KEYSTORE_PASSWORD" ] && echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV" || true
          [ -n "$KEY_PASSWORD" ] && echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV" || true

      - name: Build APK (manual chain, see build.sh)
        run: bash build.sh

      - name: Verify APK (signature, package, version)
        run: |
          APK=build-manual/ikantv.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -5
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ikantv-${{ github.sha }}
          path: build-manual/ikantv.apk
          retention-days: 30
