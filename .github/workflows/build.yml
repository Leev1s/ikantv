name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: checkout + artifact upload need nothing more.
permissions:
  contents: read

jobs:
  build:
    # Pinned (not ubuntu-latest): the runner image is part of the toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 34, build-tools 34.0.0)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # Signing keystore, first hit wins:
      #   1. Repository secret SIGNING_KEYSTORE_B64 (base64 of ikantv.jks)
      #   2. keystore/ikantv.jks.b64 committed in this private repo
      # Passwords: secrets KEYSTORE_PASSWORD / KEY_PASSWORD if set,
      # otherwise the long-standing local defaults inside build.sh.
      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ikantv.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ikantv.jks" >> "$GITHUB_ENV"
            echo "keystore source: GitHub secret"
          elif [ -f keystore/ikantv.jks.b64 ]; then
            echo "keystore source: repo base64 file (build.sh decodes it)"
          else
            echo "::error::No signing keystore: set secret SIGNING_KEYSTORE_B64 or commit keystore/ikantv.jks.b64"
            exit 1
          fi
          [ -n "$KEYSTORE_PASSWORD" ] && echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV" || true
          [ -n "$KEY_PASSWORD" ] && echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV" || true

      - name: Test and build release APK
        run: bash build.sh

      - name: Verify release identity and VLC resources
        run: bash tools/verify-apk.sh

      - name: Upload core regression results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-regression-results
          path: app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ikantv-${{ github.sha }}
          path: build-manual/ikantv.apk
          retention-days: 30
